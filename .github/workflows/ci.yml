
name: CI — Portfolio

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - run: npm run lint

      - name: Notify Vercel — lint
        if: always()
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: "Vercel - my-portfolio: lint"

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - run: npm run type-check

      - name: Notify Vercel — type-check
        if: always()
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: "Vercel - my-portfolio: type-check"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, type-check]   
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - run: npm run build

      - name: Notify Vercel — build
        if: always()
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: "Vercel - my-portfolio: build"